[package]
name = "firstcall"
version = "0.1.0"
edition = "2024"
license = "MIT"
default-run = "firstcall"

[[bin]]
name = "firstcall"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "firstcall-cli"
path = "src/bin/firstcall-cli.rs"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:egui"]
native-keyring = [
    "dep:keyring",
    "keyring/apple-native",
    "keyring/windows-native",
    "keyring/linux-native",
]

[dependencies]
anyhow = "=1.0.102"
base64 = "=0.22.1"
chrono = { version = "=0.4.44", features = ["clock", "serde"] }
directories = "=6.0.0"
eframe = { version = "=0.34.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
egui = { version = "=0.34.1", optional = true }
jsonschema = { version = "=0.46.2", default-features = false }
keyring = { version = "=3.6.3", default-features = false, optional = true }
once_cell = "=1.21.4"
openapiv3 = "=2.2.0"
regex = "=1.12.3"
reqwest = { version = "=0.13.2", default-features = false, features = ["blocking", "charset", "http2", "json", "multipart", "rustls"] }
rusqlite = { version = "=0.39.0", features = ["bundled", "chrono", "serde_json"] }
secrecy = "=0.10.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
shlex = "=1.3.0"
thiserror = "=2.0.18"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
url = { version = "=2.5.8", features = ["serde"] }
uuid = { version = "=1.23.1", features = ["serde", "v4"] }
yaml_serde = "=0.10.4"

[dev-dependencies]
tempfile = "=3.23.0"
