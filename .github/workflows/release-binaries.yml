name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload assets for, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev

      - name: Build release binaries
        run: cargo build --locked --release --bin firstcall --bin firstcall-cli

      - name: Smoke check CLI binary
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { ".exe" } else { "" }
          & "target/release/firstcall-cli$exe" version

      - name: Package binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:RELEASE_TAG
          $target = "${{ matrix.target }}"
          $packageName = "firstcall-$tag-$target"
          $packageDir = Join-Path "dist" $packageName
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null

          $exe = if ($IsWindows) { ".exe" } else { "" }
          Copy-Item "target/release/firstcall$exe" (Join-Path $packageDir "firstcall$exe")
          Copy-Item "target/release/firstcall-cli$exe" (Join-Path $packageDir "firstcall-cli$exe")

          @"
          FirstCall $tag ($target)

          Included binaries:
          - firstcall: desktop GUI workbench
          - firstcall-cli: automation CLI

          Quick checks:
          - firstcall-cli version
          - firstcall-cli --help

          CLI verification remains environment-first. Do not put real secrets in
          command history, scripts, or exported artifacts.
          "@ | Set-Content -Path (Join-Path $packageDir "README-RELEASE.txt") -Encoding utf8

          if ("${{ matrix.archive }}" -eq "zip") {
            $asset = "dist/$packageName.zip"
            Compress-Archive -Path "$packageDir/*" -DestinationPath $asset -Force
          } else {
            $asset = "dist/$packageName.tar.gz"
            tar -C "dist" -czf $asset $packageName
          }

          "ASSET_PATH=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: firstcall-${{ env.RELEASE_TAG }}-${{ matrix.target }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums and release notes
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum firstcall-* > SHA256SUMS.txt
          cd ..
          cat > release-notes.md <<'EOF'
          FirstCall binary release assets.

          Download the archive for your OS, extract it, and run:

          - `firstcall` for the desktop GUI workbench.
          - `firstcall-cli version` for the automation CLI.

          CLI verification remains environment-first. Do not put real secrets in
          command history, scripts, or exported artifacts.
          EOF

      - name: Create release if needed and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; uploading deterministic assets."
          else
            gh release create "$tag" --title "FirstCall $tag" --notes-file release-notes.md
          fi

          gh release upload "$tag" release-assets/* --clobber
