name: CLI lifecycle

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cli-lifecycle.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "fixtures/**"
      - "src/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/cli-lifecycle.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "fixtures/**"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cli-lifecycle:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run CLI lifecycle
        shell: bash
        run: |
          set -euo pipefail
          run_cli() {
            cargo run --locked --bin firstcall-cli --no-default-features -- "$@"
          }

          check_json() {
            python3 "$RUNNER_TEMP/check_json.py" "$@"
          }

          python3 --version

          cat > "$RUNNER_TEMP/check_json.py" <<'PY'
          import json
          import sys

          path, expression = sys.argv[1], sys.argv[2]
          with open(path, "r", encoding="utf-8") as handle:
              data = json.load(handle)

          def fail(message):
              raise SystemExit(message)

          if not eval(expression, {"__builtins__": {}}, {"data": data, "fail": fail, "len": len}):
              fail(f"JSON check failed: {expression}")
          PY

          cat > "$RUNNER_TEMP/loopback_server.py" <<'PY'
          import http.server
          import json
          import os
          import sys

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get("Content-Length", "0"))
                  if length:
                      self.rfile.read(length)
                  body = json.dumps({"ok": True}).encode("utf-8")
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, format, *args):
                  return

          port_path = sys.argv[1]
          max_requests = int(sys.argv[2])
          server = http.server.HTTPServer(("127.0.0.1", 0), Handler)
          with open(port_path, "w", encoding="utf-8") as handle:
              handle.write(str(server.server_port))
          for _ in range(max_requests):
              server.handle_request()
          PY

          port_file="$RUNNER_TEMP/firstcall-loopback-port.txt"
          python3 "$RUNNER_TEMP/loopback_server.py" "$port_file" 2 &
          server_pid=$!
          cleanup() {
            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          for _ in {1..100}; do
            if [ -s "$port_file" ]; then
              break
            fi
            sleep 0.1
          done
          test -s "$port_file"
          loopback_port="$(cat "$port_file")"

          recipe_json="$RUNNER_TEMP/ci-loopback-recipe.json"
          python3 - "$recipe_json" "$loopback_port" <<'PY'
          import json
          import sys

          recipe_path, port = sys.argv[1], sys.argv[2]
          recipe = {
              "id": None,
              "name": "CI Loopback Create User",
              "method": "POST",
              "url_template": f"http://127.0.0.1:{port}/users/{{{{user_id}}}}?api_key=<redacted>",
              "headers_template": [
                  {
                      "key": "Authorization",
                      "value": "Bearer <redacted>",
                      "required": True,
                      "description": "Bearer token",
                      "confidence": "high",
                  },
                  {
                      "key": "Content-Type",
                      "value": "application/json",
                      "required": True,
                      "description": "JSON request body",
                      "confidence": "high",
                  },
              ],
              "query_template": [],
              "body_template": {"json": {"template": "{\"email\":\"{{email}}\"}"}},
              "auth_style": {
                  "bearer": {
                      "token_slot": "bearer_token",
                      "header_name": "Authorization",
                  }
              },
              "slots": [
                  {
                      "name": "user_id",
                      "location": "path",
                      "required": True,
                      "current_value": None,
                      "description": "User identifier",
                      "confidence": "high",
                  },
                  {
                      "name": "email",
                      "location": "body",
                      "required": True,
                      "current_value": None,
                      "description": "Updated email address",
                      "confidence": "high",
                  },
                  {
                      "name": "bearer_token",
                      "location": "auth",
                      "required": True,
                      "current_value": "<redacted>",
                      "description": "Bearer token from environment",
                      "confidence": "high",
                  },
              ],
              "last_success_at": "2026-04-29T00:00:00Z",
              "last_success_status": 200,
          }
          with open(recipe_path, "w", encoding="utf-8") as handle:
              json.dump(recipe, handle, indent=2)
          PY

          run_cli version
          run_cli package --recipe-json "$recipe_json" --out ./dist/ci-agent-tool
          run_cli validate-package --dir ./dist/ci-agent-tool --json > "$RUNNER_TEMP/validate-initial.json"
          check_json "$RUNNER_TEMP/validate-initial.json" 'data["status"] == "valid"'
          pushd ./dist/ci-agent-tool/mcp-server
          npm install
          npm run build
          popd
          FIRSTCALL_SLOT_USER_ID=mcp_user \
          FIRSTCALL_SLOT_EMAIL=mcp@example.invalid \
          FIRSTCALL_BEARER_TOKEN=ci_dummy_bearer \
          FIRSTCALL_API_KEY=ci_dummy_api_key \
            node ./scripts/mcp_roundtrip_client.mjs \
              --package-dir ./dist/ci-agent-tool/mcp-server \
              --tool ci_loopback_create_user \
              --args '{"user_id":"mcp_user","email":"mcp@example.invalid"}' \
              > "$RUNNER_TEMP/mcp-roundtrip.json"
          check_json "$RUNNER_TEMP/mcp-roundtrip.json" 'data["mcp_roundtrip"] == "passed"'
          check_json "$RUNNER_TEMP/mcp-roundtrip.json" 'data["status"] == 200'
          run_cli inspect-package --dir ./dist/ci-agent-tool --json > "$RUNNER_TEMP/inspect-initial.json"
          check_json "$RUNNER_TEMP/inspect-initial.json" 'data["import_readiness"] == "ready"'
          run_cli import-package --dir ./dist/ci-agent-tool --data-dir ./tmp/firstcall-data --config-dir ./tmp/firstcall-config --json > "$RUNNER_TEMP/import.json"
          check_json "$RUNNER_TEMP/import.json" 'data["import_status"] == "imported"'
          check_json "$RUNNER_TEMP/import.json" 'data["requires_local_re_verification"] == True'
          recipe_id="$(python3 - "$RUNNER_TEMP/import.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              print(json.load(handle)["imported_recipe_id"])
          PY
          )"
          run_cli recipe-list --data-dir ./tmp/firstcall-data --config-dir ./tmp/firstcall-config --json > "$RUNNER_TEMP/recipe-list.json"
          check_json "$RUNNER_TEMP/recipe-list.json" 'len(data["recipes"]) >= 1'
          run_cli recipe-show --id "$recipe_id" --data-dir ./tmp/firstcall-data --config-dir ./tmp/firstcall-config --json > "$RUNNER_TEMP/recipe-show-before.json"
          check_json "$RUNNER_TEMP/recipe-show-before.json" 'data["recipe"]["requires_local_re_verification"] == True'
          FIRSTCALL_SLOT_USER_ID=ci_user \
          FIRSTCALL_SLOT_EMAIL=ci@example.invalid \
          FIRSTCALL_BEARER_TOKEN=ci_dummy_bearer \
          FIRSTCALL_API_KEY=ci_dummy_api_key \
            run_cli verify --recipe-id "$recipe_id" --data-dir ./tmp/firstcall-data --config-dir ./tmp/firstcall-config --allow-mutating --dry-run --json > "$RUNNER_TEMP/dry-run.json"
          check_json "$RUNNER_TEMP/dry-run.json" 'data["preflight_status"] == "ready"'
          check_json "$RUNNER_TEMP/dry-run.json" 'data["would_execute_http"] == False'
          FIRSTCALL_SLOT_USER_ID=ci_user \
          FIRSTCALL_SLOT_EMAIL=ci@example.invalid \
          FIRSTCALL_BEARER_TOKEN=ci_dummy_bearer \
          FIRSTCALL_API_KEY=ci_dummy_api_key \
            run_cli verify --recipe-id "$recipe_id" --data-dir ./tmp/firstcall-data --config-dir ./tmp/firstcall-config --allow-mutating --json > "$RUNNER_TEMP/actual-verify.json"
          check_json "$RUNNER_TEMP/actual-verify.json" 'data["success"] == True'
          check_json "$RUNNER_TEMP/actual-verify.json" 'data["updated_stored_recipe_verification"] == True'
          wait "$server_pid"
          run_cli recipe-show --id "$recipe_id" --data-dir ./tmp/firstcall-data --config-dir ./tmp/firstcall-config --json > "$RUNNER_TEMP/recipe-show-after.json"
          check_json "$RUNNER_TEMP/recipe-show-after.json" 'data["recipe"]["requires_local_re_verification"] == False'
          run_cli package --recipe-id "$recipe_id" --data-dir ./tmp/firstcall-data --config-dir ./tmp/firstcall-config --out ./dist/ci-reverified-agent-tool
          run_cli validate-package --dir ./dist/ci-reverified-agent-tool --json > "$RUNNER_TEMP/validate-reexport.json"
          check_json "$RUNNER_TEMP/validate-reexport.json" 'data["status"] == "valid"'
          run_cli inspect-package --dir ./dist/ci-reverified-agent-tool --json > "$RUNNER_TEMP/inspect-reexport.json"
          check_json "$RUNNER_TEMP/inspect-reexport.json" 'data["import_readiness"] == "ready"'
