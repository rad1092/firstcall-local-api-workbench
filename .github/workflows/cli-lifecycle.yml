name: CLI lifecycle

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cli-lifecycle.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "fixtures/**"
      - "src/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/cli-lifecycle.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "fixtures/**"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cli-lifecycle:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev

      - name: Run CLI lifecycle
        run: |
          set -euxo pipefail
          cargo run --locked --bin firstcall-cli -- version
          cargo run --locked --bin firstcall-cli -- package --recipe-json fixtures/verified-agent-recipe.json --out ./dist/ci-agent-tool
          cargo run --locked --bin firstcall-cli -- validate-package --dir ./dist/ci-agent-tool --json
          cargo run --locked --bin firstcall-cli -- inspect-package --dir ./dist/ci-agent-tool --json
          cargo run --locked --bin firstcall-cli -- import-package --dir ./dist/ci-agent-tool --data-dir ./tmp/firstcall-data --config-dir ./tmp/firstcall-config --json
          cargo run --locked --bin firstcall-cli -- recipe-list --data-dir ./tmp/firstcall-data --config-dir ./tmp/firstcall-config --json
          cargo run --locked --bin firstcall-cli -- recipe-show --id 1 --data-dir ./tmp/firstcall-data --config-dir ./tmp/firstcall-config --json
          FIRSTCALL_SLOT_USER_ID=ci_user \
          FIRSTCALL_SLOT_EMAIL=ci@example.invalid \
          FIRSTCALL_BEARER_TOKEN=ci_dummy_bearer \
          FIRSTCALL_API_KEY=ci_dummy_api_key \
            cargo run --locked --bin firstcall-cli -- verify --recipe-id 1 --data-dir ./tmp/firstcall-data --config-dir ./tmp/firstcall-config --allow-mutating --dry-run --json
