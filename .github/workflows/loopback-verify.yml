name: Loopback verify

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/loopback-verify.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/verify_loopback.rs"
  pull_request:
    paths:
      - ".github/workflows/loopback-verify.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/verify_loopback.rs"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-loopback:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev

      - name: Run loopback verify tests
        run: cargo test --locked --test verify_loopback
