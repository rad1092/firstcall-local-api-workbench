name: Security audit

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (2026-06-30)
        with:
          toolchain: 1.96.1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-audit
        # cargo-audit 0.22.2's published lock contains newly-advised transitive
        # versions. Keep the tool version fixed but temporarily re-resolve its
        # compatible tree until a release ships a safe lock.
        run: cargo install cargo-audit --version 0.22.2 --root "$RUNNER_TEMP/cargo-audit"

      - name: Run cargo audit
        run: '"$RUNNER_TEMP/cargo-audit/bin/cargo-audit" audit --deny unsound --deny yanked'

  npm-audit:
    name: generated MCP npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.14.0

      - name: Pin npm version
        run: npm install --global --ignore-scripts npm@11.16.0

      - name: Install and audit canonical generated runtime tree
        working-directory: assets/mcp-server
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
